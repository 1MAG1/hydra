name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-version:
    name: Verify tag matches Cargo.toml
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - id: check
        name: Compare version with Git tag
        run: |
          set -euo pipefail
          VERSION=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          TAG="${GITHUB_REF_NAME#v}"
          echo "manifest=$VERSION tag=$TAG"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$VERSION" != "$TAG" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match workspace version $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  build-binaries:
    name: Build Binary (${{ matrix.asset_name }})
    runs-on: ${{ matrix.os }}
    needs: [verify-version]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset_name: hydra-linux-amd64
            archive_ext: tar.gz
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset_name: hydra-linux-arm64
            archive_ext: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            asset_name: hydra-macos-arm64
            archive_ext: tar.gz
          - os: macos-13
            target: x86_64-apple-darwin
            asset_name: hydra-macos-amd64
            archive_ext: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset_name: hydra-windows-amd64
            archive_ext: zip
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust target
        run: rustup toolchain install stable --profile minimal --target ${{ matrix.target }}

      - name: Set up Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --bin hydra --target ${{ matrix.target }}

      - name: Package release assets
        shell: bash
        run: |
          set -euo pipefail

          sha256_of() {
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$1"
            elif command -v shasum >/dev/null 2>&1; then
              shasum -a 256 "$1"
            else
              python3 -c "
          import hashlib, sys
          h = hashlib.sha256()
          with open(sys.argv[1], 'rb') as f:
              for chunk in iter(lambda: f.read(1 << 20), b''):
                  h.update(chunk)
          print(h.hexdigest() + '  ' + sys.argv[1])
          " "$1"
            fi
          }

          BIN_EXT=""
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            BIN_EXT=".exe"
          fi

          DIST_DIR="dist/${{ matrix.asset_name }}"
          mkdir -p "$DIST_DIR" "$DIST_DIR/completions" "$DIST_DIR/man"

          cp "target/${{ matrix.target }}/release/hydra${BIN_EXT}" "$DIST_DIR/"
          cp LICENSE LICENSE-MIT LICENSE-APACHE LICENSING.md THIRD-PARTY-NOTICES.md "$DIST_DIR/" 2>/dev/null || true
          [ -f README.md ] && cp README.md "$DIST_DIR/" || true

          cargo run -p hydra-cli -- completions bash > "$DIST_DIR/completions/hydra.bash" 2>/dev/null || true
          cargo run -p hydra-cli -- completions zsh > "$DIST_DIR/completions/_hydra" 2>/dev/null || true
          cargo run -p hydra-cli -- completions fish > "$DIST_DIR/completions/hydra.fish" 2>/dev/null || true
          cargo run -p hydra-cli -- completions elvish > "$DIST_DIR/completions/hydra.elv" 2>/dev/null || true
          cargo run -p hydra-cli -- completions powershell > "$DIST_DIR/completions/hydra.ps1" 2>/dev/null || true

          if [ -d "docs/man" ]; then
            cp docs/man/*.1 "$DIST_DIR/man/" 2>/dev/null || true
          fi

          PKG_NAME="${{ matrix.asset_name }}-${{ github.ref_name }}"
          if [ "${{ matrix.archive_ext }}" = "zip" ]; then
            cd dist
            7z a "../${PKG_NAME}.zip" "${{ matrix.asset_name }}/*"
            cd ..
            sha256_of "${PKG_NAME}.zip" > "${PKG_NAME}.zip.sha256"
          else
            tar -czf "${PKG_NAME}.tar.gz" -C "dist/${{ matrix.asset_name }}" .
            sha256_of "${PKG_NAME}.tar.gz" > "${PKG_NAME}.tar.gz.sha256"
          fi

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: |
            ${{ matrix.asset_name }}-${{ github.ref_name }}.${{ matrix.archive_ext }}
            ${{ matrix.asset_name }}-${{ github.ref_name }}.${{ matrix.archive_ext }}.sha256

  publish-crates:
    name: Publish crates.io release
    runs-on: ubuntu-latest
    needs: [verify-version, build-binaries]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal

      - name: Publish workspace crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_PUBLISH_TOKEN || secrets.CRATES_IO_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          echo "Publishing workspace version ${VERSION}"

          USER_AGENT="hydra-release-ci (${VERSION}; +https://github.com/ja7ad/hydra)"

          sparse_index_url() {
            local name
            name=$(echo "$1" | tr '[:upper:]' '[:lower:]')
            local len=${#name}
            if [ "$len" -eq 1 ]; then
              echo "https://index.crates.io/1/${name}"
            elif [ "$len" -eq 2 ]; then
              echo "https://index.crates.io/2/${name}"
            elif [ "$len" -eq 3 ]; then
              echo "https://index.crates.io/3/${name:0:1}/${name}"
            else
              echo "https://index.crates.io/${name:0:2}/${name:2:2}/${name}"
            fi
          }

          is_indexed() {
            local name="$1"
            curl -sf -A "$USER_AGENT" "$(sparse_index_url "$name")" \
              | grep -q "\"vers\":\"${VERSION}\""
          }

          publish_crate() {
            local name="$1"
            if is_indexed "$name"; then
              echo "${name} ${VERSION} is already published, skipping"
              return
            fi
            echo "Publishing ${name} ${VERSION}"
            cargo publish -p "${name}" --locked
            echo "Waiting for ${name} ${VERSION} to be indexed on crates.io..."
            for _ in $(seq 1 60); do
              if is_indexed "$name"; then
                echo "${name} ${VERSION} is live"
                return
              fi
              sleep 10
            done
            echo "Timed out waiting for ${name} ${VERSION} to be indexed" >&2
            exit 1
          }

          publish_crate hydra-core
          publish_crate hydra-net
          publish_crate hydra-cli
